version: v2
plugins:
  - remote: buf.build/community/stephenh-ts-proto:v2.12.0
    out: apps/presence/src/pb
    opt:
      - env=node
      - outputServices=grpc-js

  - remote: buf.build/grpc/csharp:v1.83.0
    out: apps/message/Generated
    opt:
      - base_namespace=Message
  - remote: buf.build/protocolbuffers/csharp:v35.1
    out: apps/message/Generated
    opt:
      - base_namespace=Message

  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: apps/gateway/src/pb
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: apps/gateway/src/pb

